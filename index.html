<!DOCTYPE html>
<html lang="en">

  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    :root{
      --green:#16A34A;--green-deep:#15803D;--green-pale:#DCFCE7;--green-mid:#22C55E;
      --slate:#0F172A;--slate-mid:#334155;--slate-light:#64748B;--slate-lighter:#94A3B8;
      --chalk:#F8FAFC;--white:#FFFFFF;--border:#E2E8F0;--border-mid:#CBD5E1;
      --gold:#D97706;--gold-pale:#FEF3C7;
      --font-display:'Playfair Display',Georgia,serif;
      --font-body:'Outfit',system-ui,sans-serif;
      --radius:16px;--radius-sm:10px;--radius-lg:24px;
      --shadow-sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
      --shadow-md:0 4px 16px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
      --shadow-lg:0 20px 40px rgba(0,0,0,.1),0 8px 16px rgba(0,0,0,.06);
      --shadow-green:0 8px 24px rgba(22,163,74,.25);
    }
    html,body,#root{min-height:100%;background:var(--chalk);font-family:var(--font-body)}

    @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

    .fu0{animation:fadeUp .6s ease both}
    .fu1{animation:fadeUp .6s .1s ease both}
    .fu2{animation:fadeUp .6s .2s ease both}
    .fu3{animation:fadeUp .6s .3s ease both}
    .fu4{animation:fadeUp .6s .4s ease both}
    .fi{animation:fadeIn .4s ease both}
    .card-enter{animation:fadeUp .5s ease both}

    .shimmer{
      background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%);
      background-size:200% 100%;animation:shimmer 1.8s infinite;
      border-radius:var(--radius);
    }

    /* Nav */
    .nav{
      background:rgba(255,255,255,.95);
      backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
      border-bottom:1px solid var(--border);
      padding:0 24px;
      display:flex;justify-content:space-between;align-items:center;
      position:sticky;top:0;z-index:100;height:64px;
    }
    .nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
    .nav-logo-icon{
      width:36px;height:36px;
      background:linear-gradient(135deg,var(--green),var(--green-mid));
      border-radius:10px;
      display:flex;align-items:center;justify-content:center;
      box-shadow:var(--shadow-green);
      flex-shrink:0;
    }
    .nav-logo-text{font-family:var(--font-display);font-size:19px;font-weight:700;color:var(--slate);letter-spacing:-.02em}
    .nav-logo-text span{color:var(--green)}
    .nav-actions{display:flex;align-items:center;gap:10px}

    /* Buttons */
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      border:none;border-radius:var(--radius-sm);
      font-family:var(--font-body);font-weight:600;
      cursor:pointer;transition:all .15s;text-decoration:none;
    }
    .btn:active{transform:scale(.97)}
    .btn-green{background:var(--green);color:#fff;box-shadow:var(--shadow-green)}
    .btn-green:hover{background:var(--green-deep)}
    .btn-green:disabled{background:#CBD5E1;box-shadow:none;cursor:not-allowed}
    .btn-outline{background:transparent;color:var(--slate);border:1.5px solid var(--border-mid)}
    .btn-outline:hover{background:var(--chalk);border-color:var(--slate-light)}
    .btn-white{background:#fff;color:var(--slate);box-shadow:var(--shadow-sm);border:1px solid var(--border)}
    .btn-white:hover{box-shadow:var(--shadow-md)}
    .btn-sm{font-size:13px;padding:8px 14px}
    .btn-md{font-size:15px;padding:12px 20px}
    .btn-lg{font-size:17px;padding:16px 28px}
    .btn-full{width:100%}

    /* Hero */
    .hero{
      background:linear-gradient(160deg,#F0FDF4 0%,#DCFCE7 40%,#F8FAFC 100%);
      padding:72px 24px 80px;
      text-align:center;
      position:relative;
      overflow:hidden;
    }
    .hero::before{
      content:'';position:absolute;inset:0;
      background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(22,163,74,.08) 0%,transparent 70%);
      pointer-events:none;
    }
    .hero-badge{
      display:inline-flex;align-items:center;gap:6px;
      background:#fff;border:1px solid var(--green-pale);
      color:var(--green-deep);font-size:12px;font-weight:600;
      padding:6px 14px;border-radius:20px;margin-bottom:24px;
      box-shadow:var(--shadow-sm);
      letter-spacing:.04em;text-transform:uppercase;
    }
    .hero-badge-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
    .hero-title{
      font-family:var(--font-display);
      font-size:clamp(36px,7vw,64px);
      font-weight:700;color:var(--slate);
      line-height:1.1;letter-spacing:-.03em;
      margin-bottom:20px;max-width:720px;margin-left:auto;margin-right:auto;
    }
    .hero-title em{color:var(--green);font-style:italic;font-weight:400}
    .hero-sub{
      font-size:clamp(15px,2.5vw,18px);color:var(--slate-light);
      line-height:1.65;max-width:520px;margin:0 auto 40px;font-weight:400;
    }

    /* Search bar */
    .search-bar{
      background:#fff;border-radius:var(--radius);
      box-shadow:var(--shadow-lg);border:1px solid var(--border);
      padding:8px;display:flex;gap:6px;align-items:center;
      max-width:640px;margin:0 auto 48px;flex-wrap:wrap;
    }
    .search-input-wrap{flex:1;min-width:160px;position:relative}
    .search-input{
      width:100%;border:none;outline:none;
      font-family:var(--font-body);font-size:15px;color:var(--slate);
      padding:10px 14px;background:transparent;
    }
    .search-input::placeholder{color:var(--slate-lighter)}
    .search-divider{width:1px;height:28px;background:var(--border);flex-shrink:0}
    .search-select{
      border:none;outline:none;background:transparent;
      font-family:var(--font-body);font-size:14px;color:var(--slate-mid);
      padding:10px 12px;cursor:pointer;-webkit-appearance:none;appearance:none;
      min-width:120px;
    }

    /* Stats bar */
    .stats-bar{
      display:flex;justify-content:center;gap:0;
      background:#fff;border-radius:var(--radius);
      border:1px solid var(--border);box-shadow:var(--shadow-sm);
      overflow:hidden;max-width:560px;margin:0 auto;
    }
    .stat-item{
      flex:1;padding:16px 12px;text-align:center;
      border-right:1px solid var(--border);
    }
    .stat-item:last-child{border-right:none}
    .stat-num{font-family:var(--font-display);font-size:24px;font-weight:700;color:var(--slate);margin-bottom:2px}
    .stat-label{font-size:11px;color:var(--slate-lighter);font-weight:500;text-transform:uppercase;letter-spacing:.06em}

    /* Filter bar */
    .filter-bar{
      background:#fff;border-bottom:1px solid var(--border);
      padding:12px 24px;display:flex;gap:8px;align-items:center;
      overflow-x:auto;-webkit-overflow-scrolling:touch;
    }
    .filter-bar::-webkit-scrollbar{display:none}
    .filter-chip{
      display:inline-flex;align-items:center;gap:6px;
      background:var(--chalk);border:1.5px solid var(--border);
      color:var(--slate-mid);font-size:13px;font-weight:500;
      padding:7px 14px;border-radius:20px;white-space:nowrap;cursor:pointer;
      transition:all .15s;font-family:var(--font-body);
    }
    .filter-chip:hover{border-color:var(--green);color:var(--green)}
    .filter-chip.active{background:var(--green-pale);border-color:var(--green);color:var(--green-deep);font-weight:600}

    /* Listing grid */
    .listings-section{max-width:1200px;margin:0 auto;padding:32px 24px 100px}
    .listings-header{
      display:flex;justify-content:space-between;align-items:center;
      margin-bottom:24px;flex-wrap:wrap;gap:12px;
    }
    .listings-title{font-family:var(--font-display);font-size:22px;font-weight:600;color:var(--slate)}
    .listings-count{font-size:14px;color:var(--slate-light);margin-top:2px}
    .listings-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
      gap:20px;
    }

    /* Listing card */
    .listing-card{
      background:#fff;border-radius:var(--radius);
      border:1px solid var(--border);
      box-shadow:var(--shadow-sm);
      overflow:hidden;cursor:pointer;
      transition:box-shadow .2s,transform .2s;
    }
    .listing-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
    .listing-card:active{transform:scale(.99)}
    .listing-img{
      width:100%;height:200px;object-fit:cover;
      background:linear-gradient(135deg,#E2E8F0,#CBD5E1);
      display:flex;align-items:center;justify-content:center;
      position:relative;overflow:hidden;
    }
    .listing-img-placeholder{
      display:flex;flex-direction:column;align-items:center;gap:8px;
    }
    .listing-badge{
      position:absolute;top:12px;left:12px;
      background:#fff;color:var(--slate);
      font-size:11px;font-weight:700;padding:4px 10px;
      border-radius:20px;box-shadow:var(--shadow-sm);
      text-transform:uppercase;letter-spacing:.06em;
    }
    .listing-badge.featured{background:var(--gold);color:#fff}
    .listing-save{
      position:absolute;top:12px;right:12px;
      width:32px;height:32px;border-radius:50%;background:#fff;
      display:flex;align-items:center;justify-content:center;
      box-shadow:var(--shadow-sm);cursor:pointer;border:none;
      transition:all .15s;
    }
    .listing-save:hover{transform:scale(1.1)}
    .listing-save.saved svg{fill:#EF4444;stroke:#EF4444}
    .listing-body{padding:18px}
    .listing-price{
      font-family:var(--font-display);font-size:22px;font-weight:700;
      color:var(--slate);margin-bottom:4px;
    }
    .listing-name{font-size:15px;font-weight:600;color:var(--slate);margin-bottom:4px;line-height:1.3}
    .listing-location{
      display:flex;align-items:center;gap:4px;
      font-size:13px;color:var(--slate-light);margin-bottom:14px;
    }
    .listing-metrics{
      display:grid;grid-template-columns:1fr 1fr 1fr;
      gap:8px;padding:12px 0;
      border-top:1px solid var(--border);border-bottom:1px solid var(--border);
      margin-bottom:12px;
    }
    .metric{text-align:center}
    .metric-val{font-size:15px;font-weight:700;color:var(--slate);margin-bottom:1px}
    .metric-key{font-size:10px;color:var(--slate-lighter);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
    .listing-tags{display:flex;flex-wrap:wrap;gap:6px}
    .listing-tag{
      background:var(--chalk);color:var(--slate-mid);
      font-size:11px;font-weight:500;padding:3px 8px;border-radius:6px;
    }

    /* Detail modal */
    .overlay{
      position:fixed;inset:0;background:rgba(15,23,42,.7);
      backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
      display:flex;align-items:flex-end;justify-content:center;
      z-index:200;animation:fadeIn .2s ease;
    }
    .detail-sheet{
      background:#fff;border-radius:28px 28px 0 0;
      width:100%;max-width:680px;
      max-height:92vh;overflow-y:auto;
      animation:fadeUp .3s ease;
    }
    .detail-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:16px auto 0}
    .detail-img{width:100%;height:240px;background:linear-gradient(135deg,#E2E8F0,#CBD5E1);display:flex;align-items:center;justify-content:center}
    .detail-body{padding:24px}
    .detail-price{font-family:var(--font-display);font-size:28px;font-weight:700;color:var(--slate);margin-bottom:4px}
    .detail-name{font-size:18px;font-weight:600;color:var(--slate);margin-bottom:8px}
    .detail-metrics{
      display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
      background:var(--chalk);border-radius:var(--radius-sm);
      padding:16px;margin:16px 0;
    }
    .detail-metric{text-align:center}
    .detail-metric-val{font-size:18px;font-weight:700;color:var(--slate);margin-bottom:2px}
    .detail-metric-key{font-size:11px;color:var(--slate-light);text-transform:uppercase;letter-spacing:.06em}
    .detail-section{margin-bottom:20px}
    .detail-section-title{font-size:13px;font-weight:700;color:var(--slate-mid);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
    .detail-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
    .detail-row-key{color:var(--slate-light)}
    .detail-row-val{color:var(--slate);font-weight:500}

    /* Paywall */
    .paywall-sheet{
      background:#fff;border-radius:28px 28px 0 0;
      padding:12px 24px 48px;width:100%;max-width:480px;
      animation:fadeUp .3s ease;max-height:92vh;overflow-y:auto;
    }
    .handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 28px}
    .plan-card{border:2px solid var(--border);border-radius:20px;padding:20px;cursor:pointer;transition:all .2s}
    .plan-card.selected{border-color:var(--green);background:#F0FDF4}

    /* Input */
    .inp{
      width:100%;border:1.5px solid var(--border);border-radius:var(--radius-sm);
      background:#fff;color:var(--slate);font-family:var(--font-body);
      font-size:16px;padding:14px 16px;outline:none;
      transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;appearance:none;
    }
    .inp:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(22,163,74,.1)}
    .inp::placeholder{color:var(--slate-lighter)}

    /* Floating CTA */
    .floating-cta{
      position:fixed;bottom:0;left:0;right:0;
      background:#fff;border-top:1px solid var(--border);
      padding:12px 20px calc(12px + env(safe-area-inset-bottom));
      z-index:100;display:flex;gap:10px;
      box-shadow:0 -8px 24px rgba(0,0,0,.06);
    }

    /* Cap rate calculator */
    .calc-card{
      background:linear-gradient(135deg,var(--slate) 0%,#1E3A5F 100%);
      border-radius:var(--radius);padding:28px;color:#fff;
      margin-bottom:32px;
    }
    .calc-title{font-family:var(--font-display);font-size:22px;font-weight:600;margin-bottom:6px}
    .calc-sub{font-size:14px;opacity:.7;margin-bottom:20px}
    .calc-inputs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
    .calc-input{
      background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
      border-radius:var(--radius-sm);padding:12px 14px;
      color:#fff;font-family:var(--font-body);font-size:15px;outline:none;
      width:100%;
    }
    .calc-input::placeholder{color:rgba(255,255,255,.4)}
    .calc-label{font-size:11px;opacity:.6;margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em}
    .calc-result{
      background:rgba(255,255,255,.15);border-radius:var(--radius-sm);
      padding:16px;display:flex;justify-content:space-between;align-items:center;
    }
    .calc-result-label{font-size:13px;opacity:.8}
    .calc-result-val{font-family:var(--font-display);font-size:28px;font-weight:700;color:var(--green-mid)}

    /* Submit form */
    .submit-section{
      background:linear-gradient(135deg,#F0FDF4,#DCFCE7);
      border:1px solid #BBF7D0;border-radius:var(--radius);
      padding:32px 28px;margin-bottom:32px;
    }
    .submit-title{font-family:var(--font-display);font-size:24px;font-weight:700;color:var(--slate);margin-bottom:6px}
    .submit-sub{font-size:15px;color:var(--slate-light);margin-bottom:24px;line-height:1.6}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .form-full{grid-column:1/-1}
    .form-label{font-size:12px;font-weight:600;color:var(--slate-mid);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:6px}
    .form-inp{width:100%;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:#fff;color:var(--slate);font-family:var(--font-body);font-size:15px;padding:12px 14px;outline:none;transition:border-color .15s;-webkit-appearance:none;appearance:none}
    .form-inp:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(22,163,74,.1)}
    .form-inp::placeholder{color:var(--slate-lighter)}
    .form-textarea{resize:vertical;min-height:100px}
    .checkbox-row{display:flex;align-items:center;gap:10px;cursor:pointer}
    .checkbox-row input{width:18px;height:18px;accent-color:var(--green);cursor:pointer}
    .success-box{background:#fff;border:2px solid var(--green);border-radius:var(--radius);padding:32px;text-align:center}

    @media(max-width:600px){
      .listings-grid{grid-template-columns:1fr}
      .hero{padding:48px 20px 56px}
      .search-bar{padding:6px}
      .calc-inputs{grid-template-columns:1fr}
      .form-grid{grid-template-columns:1fr}
    }
  </style>
</head>

async function startCheckout(){
  const stripe = Stripe(STRIPE_PK);
  const res = await fetch("/api/checkout",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({priceId:PRICE_ID})});
  const data = await res.json();
  if(data.url){ window.location.href = data.url; }

}

function SubmitListing(){
  const [form,setForm] = useState({
    name:"",email:"",phone:"",facilityName:"",city:"",state:"Texas",
    price:"",units:"",occupancy:"",noi:"",capRate:"",
    climate:false,driveUp:false,boat:false,description:"",source:""
  });
  const [loading,setLoading] = useState(false);
  const [success,setSuccess] = useState(false);
  const [error,setError]     = useState(null);

  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  const submit = async(e) => {
    e.preventDefault();
    setLoading(true); setError(null);
    try {
      const res = await fetch("/api/submit-listing",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(form),
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error ?? "Submission failed");
      setSuccess(true);
    } catch(err){
      setError(err.message);
    } finally {
      setLoading(false);
    }
  };

  if(success) return(
    <div className="success-box">
      <div style={{fontSize:48,marginBottom:12}}>🎉</div>
      <div style={{fontFamily:"var(--font-display)",fontSize:22,fontWeight:700,color:"var(--slate)",marginBottom:8}}>Listing Submitted!</div>
      <div style={{fontSize:15,color:"var(--slate-light)",lineHeight:1.6,marginBottom:20}}>
        We'll review your listing and publish it within 24 hours.<br/>We'll email you at <strong>{form.email}</strong> when it's live.
      </div>
      <button className="btn btn-green btn-md" onClick={()=>setSuccess(false)}>Submit Another Listing</button>
    </div>
  );

  return(
    <div className="submit-section">
      <div className="submit-title">List Your Facility For Free</div>
      <div className="submit-sub">
        Reach thousands of qualified self storage investors. Free to list — always.
      </div>
      <form onSubmit={submit}>
        <div className="form-grid">

          <div>
            <label className="form-label">Your Name *</label>
            <input className="form-inp" placeholder="John Smith" value={form.name} onChange={e=>set("name",e.target.value)} required/>
          </div>
          <div>
            <label className="form-label">Your Email *</label>
            <input className="form-inp" type="email" placeholder="john@email.com" value={form.email} onChange={e=>set("email",e.target.value)} required/>
          </div>
          <div>
            <label className="form-label">Phone Number</label>
            <input className="form-inp" placeholder="(555) 000-0000" value={form.phone} onChange={e=>set("phone",e.target.value)}/>
          </div>
          <div>
            <label className="form-label">Facility Name *</label>
            <input className="form-inp" placeholder="Sunshine Storage" value={form.facilityName} onChange={e=>set("facilityName",e.target.value)} required/>
          </div>
          <div>
            <label className="form-label">City *</label>
            <input className="form-inp" placeholder="Dallas" value={form.city} onChange={e=>set("city",e.target.value)} required/>
          </div>
          <div>
            <label className="form-label">State *</label>
            <div style={{position:"relative"}}>
              <select className="form-inp" value={form.state} onChange={e=>set("state",e.target.value)} style={{paddingRight:36}}>
                {["Alabama","Alaska","Arizona","Arkansas","California","Colorado","Connecticut","Delaware","Florida","Georgia","Hawaii","Idaho","Illinois","Indiana","Iowa","Kansas","Kentucky","Louisiana","Maine","Maryland","Massachusetts","Michigan","Minnesota","Mississippi","Missouri","Montana","Nebraska","Nevada","New Hampshire","New Jersey","New Mexico","New York","North Carolina","North Dakota","Ohio","Oklahoma","Oregon","Pennsylvania","Rhode Island","South Carolina","South Dakota","Tennessee","Texas","Utah","Vermont","Virginia","Washington","West Virginia","Wisconsin","Wyoming"].map(s=><option key={s}>{s}</option>)}
              </select>
              <svg style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",pointerEvents:"none"}} width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--slate-light)" strokeWidth="2"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
          </div>
          <div>
            <label className="form-label">Asking Price ($) *</label>
            <input className="form-inp" type="number" placeholder="1500000" value={form.price} onChange={e=>set("price",e.target.value)} required/>
          </div>
          <div>
            <label className="form-label">Number of Units</label>
            <input className="form-inp" type="number" placeholder="200" value={form.units} onChange={e=>set("units",e.target.value)}/>
          </div>
          <div>
            <label className="form-label">Current Occupancy (%)</label>
            <input className="form-inp" type="number" placeholder="88" value={form.occupancy} onChange={e=>set("occupancy",e.target.value)}/>
          </div>
          <div>
            <label className="form-label">Annual NOI ($)</label>
            <input className="form-inp" type="number" placeholder="120000" value={form.noi} onChange={e=>set("noi",e.target.value)}/>
          </div>
          <div>
            <label className="form-label">Cap Rate (%)</label>
            <input className="form-inp" type="number" step="0.1" placeholder="7.5" value={form.capRate} onChange={e=>set("capRate",e.target.value)}/>
          </div>
          <div>
            <label className="form-label">How did you find us?</label>
            <input className="form-inp" placeholder="Google, Reddit, referral..." value={form.source} onChange={e=>set("source",e.target.value)}/>
          </div>

          <div className="form-full">
            <label className="form-label">Amenities</label>
            <div style={{display:"flex",gap:20,flexWrap:"wrap"}}>
              {[["climate","Climate Controlled"],["driveUp","Drive-Up Access"],["boat","Boat & RV Storage"]].map(([k,l])=>(
                <label key={k} className="checkbox-row">
                  <input type="checkbox" checked={form[k]} onChange={e=>set(k,e.target.checked)}/>
                  <span style={{fontSize:14,color:"var(--slate-mid)",fontWeight:500}}>{l}</span>
                </label>
              ))}
            </div>
          </div>

          <div className="form-full">
            <label className="form-label">Property Description</label>
            <textarea className="form-inp form-textarea" placeholder="Tell investors about your facility — location highlights, recent improvements, upside potential..." value={form.description} onChange={e=>set("description",e.target.value)}/>
          </div>

          {error && <div className="form-full" style={{background:"#FFF1F2",border:"1px solid #FECDD3",borderRadius:10,padding:"12px 14px",fontSize:14,color:"#BE123C"}}>{error}</div>}

          <div className="form-full">
            <button type="submit" className="btn btn-green btn-lg btn-full" disabled={loading}>
              {loading
                ?<><svg style={{animation:"spin .8s linear infinite"}} width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5"><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" strokeOpacity=".25"/><path d="M21 12a9 9 0 00-9-9"/></svg>Submitting…</>
                :"Submit Your Listing — Free →"
              }
            </button>
            <div style={{textAlign:"center",marginTop:10,fontSize:12,color:"var(--slate-lighter)"}}>Free to list · Published within 24 hours · No commission</div>
          </div>
        </div>
      </form>
    </div>
  );
}

function App(){
  const [stateFilter,setStateFilter] = useState("All States");
  const [priceFilter,setPriceFilter] = useState("Any Price");
  const [capFilter,setCapFilter]     = useState("Any Cap Rate");
  const [search,setSearch]           = useState("");
  const [detail,setDetail]           = useState(null);
  const [paywall,setPaywall]         = useState(false);
  const [saved,setSaved]             = useState([]);
  const [viewCount,setViewCount]     = useState(0);
  const [listings] = useState(STATIC_LISTINGS);
  const loadingListings = false;
  const listingsError = null;
  const FREE_VIEWS = 3;

  const toggleSave = id => setSaved(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);

  const handleTap = listing => {
    if(viewCount >= FREE_VIEWS){ setPaywall(true); return; }
    setViewCount(v=>v+1);
    setDetail(listing);
  };

  const filtered = listings.filter(l=>{
    if(stateFilter!=="All States" && l.state!==stateFilter.slice(-2)) return false;
    if(search && !l.name?.toLowerCase().includes(search.toLowerCase()) && !l.city?.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });

  return(
    <div style={{minHeight:"100vh",background:"var(--chalk)"}}>

      {/* Nav */}
      <nav className="nav">
        <a className="nav-logo" href="#">
          <div className="nav-logo-icon"><StorageIcon size={20}/></div>
          <span className="nav-logo-text">Storage<span>Investors</span>.io</span>
        </a>
        <div className="nav-actions">
          <button className="btn btn-outline btn-sm" onClick={()=>setPaywall(true)}>Sign In</button>
          <button className="btn btn-green btn-sm" onClick={()=>setPaywall(true)}>
            Get Access · $99/mo
          </button>
        </div>
      </nav>

      {/* Hero */}
      <section className="hero">
        <div className="fu0">
          <div className="hero-badge">
            <span className="hero-badge-dot"/>
            {STATIC_LISTINGS.length}+ Active Listings Nationwide
          </div>
        </div>
        <h1 className="fu1 hero-title">
          Find Self Storage<br/>Facilities <em>For Sale</em>
        </h1>
        <p className="fu2 hero-sub">
          The most comprehensive marketplace for self storage investments. Browse listings with cap rates, NOI, and occupancy data — all in one place.
        </p>

        {/* Search */}
        <div className="fu3 search-bar">
          <div className="search-input-wrap">
            <input className="search-input" placeholder="Search by city or state..." value={search} onChange={e=>setSearch(e.target.value)}/>
          </div>
          <div className="search-divider"/>
          <select className="search-select" value={priceFilter} onChange={e=>setPriceFilter(e.target.value)}>
            {PRICE_RANGES.map(p=><option key={p}>{p}</option>)}
          </select>
          <div className="search-divider"/>
          <select className="search-select" value={capFilter} onChange={e=>setCapFilter(e.target.value)}>
            {CAP_RATES.map(c=><option key={c}>{c}</option>)}
          </select>
          <button className="btn btn-green btn-md" style={{borderRadius:10,flexShrink:0}}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            Search
          </button>
        </div>

        {/* Stats */}
        <div className="fu4 stats-bar">
          {[["$2.1B","Total Listing Value"],["6.8%","Avg Cap Rate"],["312","Active Listings"],["50","States Covered"]].map(([n,l],i)=>(
            <div key={l} className="stat-item">
              <div className="stat-num">{n}</div>
              <div className="stat-label">{l}</div>
            </div>
          ))}
        </div>
      </section>

      {/* Filter bar */}
      <div className="filter-bar">
        <span style={{fontSize:13,fontWeight:600,color:"var(--slate-mid)",whiteSpace:"nowrap",marginRight:4}}>Filter:</span>
        {["All","Climate Control","Drive-Up","Boat & RV","Under $1M","Cap Rate 7%+","100+ Units"].map(f=>(
          <button key={f} className={`filter-chip ${f==="All"?"active":""}`}>{f}</button>
        ))}
      </div>

      {/* Main content */}
      <div className="listings-section">

        {/* Cap Rate Calculator */}
        <CapRateCalc/>

        {/* Listings */}
        {loadingListings && (
          <div style={{display:"flex",flexDirection:"column",gap:16,marginBottom:32}}>
            <div style={{height:32,width:200,borderRadius:8}} className="shimmer"/>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(320px,1fr))",gap:20}}>
              {[0,1,2,3,4,5].map(i=><div key={i} className="shimmer" style={{height:320,animationDelay:`${i*.1}s`}}/>)}
            </div>
          </div>
        )}
        {listingsError && (
          <div style={{background:"#FFF1F2",border:"1px solid #FECDD3",borderRadius:16,padding:"24px",marginBottom:32,textAlign:"center"}}>
            <div style={{fontSize:32,marginBottom:8}}>⚠️</div>
            <div style={{fontFamily:"var(--font-display)",fontSize:18,fontWeight:600,color:"var(--slate)",marginBottom:4}}>Failed to load listings</div>
            <div style={{fontSize:14,color:"#BE123C"}}>{listingsError}</div>
          </div>
        )}

        {/* Listings */}
        <div className="listings-header">
          <div>
            <div className="listings-title">Self Storage Facilities For Sale</div>
            <div className="listings-count">`${filtered.length} listings · Source: Crexi`</div>
          </div>
          <button className="btn btn-outline btn-sm" onClick={()=>setPaywall(true)}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
            Deal Alerts
          </button>
        </div>

        <div className="listings-grid">
          {filtered.map((l,i)=>(
            <ListingCard
              key={l.id} listing={l} i={i}
              onTap={handleTap}
              saved={saved.includes(l.id)}
              onSave={toggleSave}
              locked={i >= FREE_VIEWS}
            />
          ))}
        </div>

        {viewCount >= FREE_VIEWS && (
          <div style={{textAlign:"center",padding:"48px 20px",background:"#fff",borderRadius:"var(--radius)",border:"1px solid var(--border)",marginTop:24,boxShadow:"var(--shadow-sm)"}}>
            <div style={{fontSize:40,marginBottom:12}}>🔒</div>
            <div style={{fontFamily:"var(--font-display)",fontSize:22,fontWeight:700,color:"var(--slate)",marginBottom:8}}>
              You've viewed {FREE_VIEWS} free listings
            </div>
            <div style={{fontSize:15,color:"var(--slate-light)",marginBottom:24,lineHeight:1.6}}>
              Subscribe to unlock all listings with full financials,<br/>broker contacts, and deal alerts.
            </div>
            <button className="btn btn-green btn-lg" onClick={()=>setPaywall(true)}>
              Get Full Access · $99/month →
            </button>
          </div>
        )}

        {/* Submit listing */}
        <SubmitListing/>

        {/* Trust section */}
        <div style={{marginTop:48,padding:"32px",background:"#fff",borderRadius:"var(--radius)",border:"1px solid var(--border)",textAlign:"center"}}>
          <div style={{fontFamily:"var(--font-display)",fontSize:20,fontWeight:600,color:"var(--slate)",marginBottom:8}}>
            Trusted by self storage investors nationwide
          </div>
          <div style={{fontSize:14,color:"var(--slate-light)",marginBottom:24}}>
            Listings sourced daily from LoopNet, Crexi, and BizBuySell
          </div>
          <div style={{display:"flex",justifyContent:"center",gap:32,flexWrap:"wrap"}}>
            {[["312","Active Listings"],["$2.1B","Total Value"],["50","States"],["Daily","Updates"]].map(([n,l])=>(
              <div key={l} style={{textAlign:"center"}}>
                <div style={{fontFamily:"var(--font-display)",fontSize:28,fontWeight:700,color:"var(--green)",marginBottom:2}}>{n}</div>
                <div style={{fontSize:12,color:"var(--slate-lighter)",textTransform:"uppercase",letterSpacing:".06em"}}>{l}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {detail && <DetailSheet listing={detail} onClose={()=>setDetail(null)} onPaywall={()=>{setDetail(null);setPaywall(true);}}/>}
      {paywall && <PaywallSheet onClose={()=>setPaywall(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
